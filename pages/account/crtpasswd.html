<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header_dreamplace--logo">
            <div><img src="../../img/plane.png" alt="A Blue Plane Logo"></div>
            <div class="header_logo--text"><p>my Dream Place</p></div>
        </div>  
    </header>
    <main>
        <h1 class="signin-title title-passwd">Create password</h1>
        <div class="specific-passwd">
            <p>Use a minimum of 10 characters, including letters, lowercase letters, and numbers.</p>
        </div>
        <form>
            <div class="form-input passwd-input">
                <p>Password</p>
                <label class="passwd-input">
                    <input type="password" name="passwd" id="passwd">   
                    <div class="input-icon">
                        <img src="icons/eye.png" alt="eye-icon">
                    </div>                        
                </label>
            </div>
            <div class="form-input passwd-input">
                <p>Confirm password</p>
                <label class="passwd-input">
                    <input type="password" name="passwd" id="passwd">   
                    <div class="input-icon">
                        <img src="icons/eye.png" alt="eye-icon">
                    </div>                        
                </label>
            </div>
            <button type="submit" class="continue-email email-crtpass">Create account</button>
        </form>
        <div class="privacy">
            <div>
                <p>By creating an account, you agree with our <span class="register"><a href="#">Terms and Conditions</a></span> and <span class="register"><a href="#">Privacy Statement</a></span>.</p>
            </div>
        </div>
    </main>
</body>
</html>
