<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header_dreamplace--logo">
            <div><img src="../../img/plane.png" alt="A Blue Plane Logo"></div>
            <div class="header_logo--text"><p>my Dream Place</p></div>
        </div>  
    </header>
    <main>
        <h1 class="signin-title">Register</h1>
        <form>
            <div class="form-input">
                <p>Email address</p>
                <input type="text" name="email" class="email">                
            </div>
            <button type="submit" class="continue-email email-register">Continue with email</button>
        </form>
        <div class="other-options_line">
            <div class="line"></div>
            <p>or use one of these options</p>
        </div>
        <div class="alternative-sign">
            <div class="sign-another google-margin">
                <div class="img-google"><img src="icons/google.png" alt="google logo"></div>
                <div class="sign-text sign-google_text">
                    <p>Continue with Google</p>
                </div>
            </div>
            <div class="sign-another facebook">
                <div class="img-fackebook"><img src="icons/facebook.png" alt="facebook-icon"></div>
                <div class="sign-text sign-facebook_text"><p>Continue with Facebook</p></div>
            </div>
            <div class="no-account">
                <p>Don't have an account? <span class="register"><a href="#">Register</a></span></p>
            </div>
        </div>
    </main>
</body>
</html>
