<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header_dreamplace--logo">
            <div><img src="../../img/plane.png" alt="A Blue Plane Logo"></div>
            <div class="header_logo--text"><p>my Dream Place</p></div>
        </div>  
    </header>
    <main>
        <h1 class="signin-title title-passwd">Forgot your password?</h1>
        <div class="specific-passwd">
            <p>We’ll send you a link to reset it. Enter your email address used for My Dream Place</p>
        </div>
        <form>
            <div class="form-input passwd-input">
                <p>Email address</p>
                <input type="text" name="email" class="email">                
            </div>
            <button type="submit" class="continue-email email-crtpass">Send Reset Link</button>
        </form>
        <div class="privacy">
            <div>
                <p>By creating an account, you agree with our <span class="register"><a href="#">Terms and Conditions</a></span> and <span class="register"><a href="#">Privacy Statement</a></span>.</p>
            </div>
        </div>
    </main>
</body>
</html>
