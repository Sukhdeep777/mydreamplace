<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header_dreamplace--logo">
            <div><img src="../../img/plane.png" alt="A Blue Plane Logo"></div>
            <div class="header_logo--text"><p>my Dream Place</p></div>
        </div>  
    </header>
    <main>
        <h1 class="signin-title">Sign in</h1>
        <form>
            <div class="form-input">
                <p>Email address</p>
                <input type="text" name="email" class="email">                
            </div>
            <div class="form-input">
                <p>Password</p>
                <input type="password" name="passwd" id="passwd">                
            </div>
            <div class="form-sign-passwd">
                <div class="checkbox">
                    <input type="checkbox" name="signedin">
                    <label for="signedin">Keep me signed in</label>
                </div>
                <div class="fgt-passwd">
                    <p><a href="#">Forgot Password?</a></p>
                </div>
            </div>
            <button type="submit" class="continue-email">Continue with emai</button>
        </form>
        <div class="other-options_line">
            <div class="line"></div>
            <p>or use one of these options</p>
        </div>
        <div class="alternative-sign">
            <div class="sign-another">
                <div class="img-google"></div>
                <div class="sign-text sign-google_text">
                    <p>Continue with Google</p>
                </div>
            </div>
            <div class="sign-another">
                <div class="img-fackebook"></div>
                <div class="sign-text sign-google_text"><p>Continue with Facebook</p></div>
            </div>
            <div class="no-account">
                <p>Don't have an account? <span class="register"><a href="#">Register</a></span></p>
            </div>
        </div>
    </main>
</body>
</html>
